name: Update formula

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-infernosim-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@v7
      - name: Find latest InfernoSIM release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(gh api repos/pranaysparihar/InfernoSIM/releases/latest --jq .tag_name)"
          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $release_tag" >&2
            exit 1
          fi
          release_version="${release_tag#v}"
          current_version="$(sed -n 's|.*archive/refs/tags/v\([^/]*\)\.tar\.gz.*|\1|p' Formula/infernosim.rb 2>/dev/null | head -n 1)"
          echo "tag=$release_tag" >>"$GITHUB_OUTPUT"
          if [[ "$current_version" == "$release_version" ]]; then
            echo "update=false" >>"$GITHUB_OUTPUT"
          else
            echo "update=true" >>"$GITHUB_OUTPUT"
          fi
      - name: Check out released InfernoSIM source
        if: steps.release.outputs.update == 'true'
        uses: actions/checkout@v7
        with:
          repository: pranaysparihar/InfernoSIM
          ref: ${{ steps.release.outputs.tag }}
          path: infernosim-source
          persist-credentials: false
      - name: Generate formula
        if: steps.release.outputs.update == 'true'
        run: infernosim-source/scripts/update-homebrew-formula.sh "${{ steps.release.outputs.tag }}" Formula/infernosim.rb
      - name: Validate formula
        if: steps.release.outputs.update == 'true'
        run: |
          ruby -c Formula/infernosim.rb
          grep -F "archive/refs/tags/${{ steps.release.outputs.tag }}.tar.gz" Formula/infernosim.rb
      - name: Publish formula
        if: steps.release.outputs.update == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/infernosim.rb
          git commit -m "Brew formula update for InfernoSIM version ${RELEASE_VERSION}"
          git push origin HEAD:main
